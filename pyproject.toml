[project]
name = "cosuil"
version = "0.1.0"
description = "Find duplicate and similar photos, review them visually, and trash the rest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cosuil contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "platformdirs>=4.0",
    "send2trash>=1.8",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "pillow-heif>=0.18",
    "blake3>=0.4",
    "numpy>=1.26",
    "rich>=13.7",
]

[project.optional-dependencies]
cnn = [
    "imagededup>=0.3.3",
    "torch>=2.2",
    "torchvision>=0.17",
    "hnswlib>=0.8",
]
avif = ["pillow-avif-plugin>=1.4"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
cosuil = "cosuil.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
